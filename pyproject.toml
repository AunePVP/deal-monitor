[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-monitor"
version = "0.1.0"
description = "Flug-Deal-Monitor mit Deal-Alarmen und Web-Oberfläche nach Travel-Dealz-Prinzipien"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dealmonitor = "dealmonitor.cli:main"

[tool.setuptools]
packages = ["dealmonitor", "dealmonitor.sources"]
include-package-data = true

[tool.setuptools.package-data]
dealmonitor = ["static/*"]
