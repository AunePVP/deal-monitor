name: Deal-Monitor

# Nur manuell: Der Monitor läuft im Container (z. B. auf Unraid) mit eigenem Zeitplan.
# Wer ihn stattdessen in GitHub Actions laufen lassen will, entfernt das "#" unten.
on:
  # schedule:
  #   - cron: "17 */3 * * *"   # alle 3 Stunden (UTC)
  workflow_dispatch: {}

concurrency:
  group: deal-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Preis-Historie und bereits gemeldete Deals zwischen den Läufen behalten
      - name: Datenbank wiederherstellen
        uses: actions/cache@v4
        with:
          path: data/deals.sqlite*
          key: deals-db-${{ github.run_id }}
          restore-keys: deals-db-

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Alarme prüfen
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          # config/alerts.toml ist hier die Quelle der Alarme: neue übernehmen, geänderte aktualisieren
          python -m dealmonitor import-config --replace
          python -m dealmonitor run

      - name: Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-report
          path: data/report.html
          if-no-files-found: ignore
